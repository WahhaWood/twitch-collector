name: worker
on:
  schedule:
    # GitHub drops scheduled runs under load, so queue one often: concurrency keeps a single
    # pending run, which starts the moment the current 6h slot ends.
    - cron: "*/30 * * * *"
  workflow_dispatch:

# One worker at a time: a new run waits for the previous one to finish.
concurrency:
  group: worker
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      # Self-chaining: queue the successor first thing, so it starts the moment this slot ends
      # (concurrency keeps one pending run). Does not depend on GitHub's unreliable cron.
      - name: Queue next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run worker.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The worker stops cleanly on SIGTERM; exit code 124 means it ran its full slot.
      - name: Run worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          timeout --signal=SIGTERM 350m npx tsx scripts/worker.mts || test $? -eq 124
      - name: Alert on crash
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || exit 0
          curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=twitch-collector: worker упал ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
