name: worker
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# One worker at a time: a new run waits for the previous one to finish.
concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The worker stops cleanly on SIGTERM; exit code 124 means it ran its full slot.
      - name: Run worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          timeout --signal=SIGTERM 350m npx tsx scripts/worker.mts || test $? -eq 124
